[pytest]
# Pytest configuration for Google Sheets Connector

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    e2e: End-to-end tests that make real API calls (use -m e2e to run)
    destructive: Tests that modify/delete real data (use with caution)
    slow: Tests that take significant time to run
    unit: Unit tests with mocked dependencies (default)

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Coverage options (when using --cov)
[coverage:run]
source = src
omit = 
    */tests/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

